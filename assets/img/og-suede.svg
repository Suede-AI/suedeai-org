<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Suede AI Research: AI agent platforms businesses run on.</title>
  <desc id="desc">Paper-and-ink brand card for suedeai.org, Suede AI's research and investor site, matching the live homepage register.</desc>
  <rect width="1200" height="630" fill="#f8f5ee"/>
  <g stroke="#5a6900" fill="none">
    <circle cx="1120" cy="20" r="90" stroke-width="2" opacity="0.55"/>
    <circle cx="1120" cy="20" r="145" stroke-width="2" opacity="0.35"/>
    <circle cx="1120" cy="20" r="205" stroke-width="2" opacity="0.2"/>
    <circle cx="1120" cy="20" r="270" stroke-width="2" opacity="0.1"/>
  </g>
  <text x="92" y="110" fill="#5d5a53" font-family="'Geist Mono', ui-monospace, monospace" font-size="22" letter-spacing="3">00 &#8212; SUEDE AI RESEARCH &amp; INVESTORS</text>
  <text x="92" y="215" fill="#242424" font-family="'Instrument Serif', Georgia, serif" font-size="84">AI agent platforms</text>
